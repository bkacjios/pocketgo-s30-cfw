<?xml version="1.0"?>
<!-- EmulationStation systems: ROMs in ~/roms/<system> (HOME=/mnt/sd/home),
     RetroArch with the core for each. A ~/.emulationstation/es_systems.cfg
     on the SD card takes precedence. -->
<systemList>
	<system>
		<name>gb</name>
		<fullname>Game Boy</fullname>
		<path>~/roms/gb</path>
		<extension>.gb .GB .gbc .GBC .zip .ZIP</extension>
		<command>retroarch -c ~/.config/retroarch/retroarch.cfg -L /usr/lib/libretro/gambatte_libretro.so %ROM%</command>
		<platform>gb</platform>
		<theme>gb</theme>
	</system>
	<system>
		<name>gba</name>
		<fullname>Game Boy Advance</fullname>
		<path>~/roms/gba</path>
		<extension>.gba .GBA .zip .ZIP</extension>
		<command>retroarch -c ~/.config/retroarch/retroarch.cfg -L /usr/lib/libretro/mgba_libretro.so %ROM%</command>
		<platform>gba</platform>
		<theme>gba</theme>
	</system>
	<system>
		<name>nes</name>
		<fullname>Nintendo Entertainment System</fullname>
		<path>~/roms/nes</path>
		<extension>.nes .NES .zip .ZIP</extension>
		<command>retroarch -c ~/.config/retroarch/retroarch.cfg -L /usr/lib/libretro/fceumm_libretro.so %ROM%</command>
		<platform>nes</platform>
		<theme>nes</theme>
	</system>
</systemList>
