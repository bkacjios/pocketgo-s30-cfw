# RetroArch defaults for the PocketGo S30 (KMS/DRM, no display server).
# Saves and states live on the SD card; everything else is read-only.
video_driver = "gl"
video_context_driver = "kms"
video_fullscreen = "true"
video_vsync = "true"
# Panel is 320x480 portrait, mounted landscape: rotate everything, menu,
# shaders and screenshots included (retroarch/patches/0001, gl driver)
screen_orientation = "3"
menu_driver = "rgui"
# 1.22 defaults this to true (OK on B); Nintendo layout wants OK on A.
menu_swap_ok_cancel_buttons = "false"
# No RTC battery: the clock is meaningless
menu_timedate_enable = "false"
audio_driver = "alsa"
audio_device = "plughw:0,0"
input_driver = "udev"
input_joypad_driver = "udev"
input_autodetect_enable = "true"
joypad_autoconfig_dir = "/etc/retroarch/autoconfig"
# Start + Select opens the menu
# Power button (axp20x-pek, KEY_POWER) opens the menu
input_menu_toggle = "power"
# Volume keys (gpio-keys) are the system volume (s30-volumed), not RetroArch's
input_volume_up = "nul"
input_volume_down = "nul"
input_menu_toggle_gamepad_combo = "4"
libretro_directory = "/usr/lib/libretro"
libretro_info_path = "/usr/share/libretro/info"
assets_directory = "/usr/share/libretro/assets"
rgui_browser_directory = "~/roms"
system_directory = "~/.config/retroarch/system"
savefile_directory = "~/.config/retroarch/saves"
savestate_directory = "~/.config/retroarch/states"
screenshot_directory = "~/.config/retroarch/screenshots"
config_save_on_exit = "true"
# RGUI look, from the old 1.9.x config. rgui_aspect_ratio 7 is 3:2 in the
# 1.22 enum (matches 480x320), lock 1 = fit screen.
rgui_aspect_ratio = "7"
rgui_aspect_ratio_lock = "1"
menu_linear_filter = "true"
menu_rgui_full_width_layout = "true"
menu_rgui_shadows = "true"
rgui_show_start_screen = "false"
rgui_switch_icons = "true"
video_smooth = "false"
