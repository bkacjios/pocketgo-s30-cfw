# Build every package (build.sh) on each push to main and publish the
# repository to the gh-pages branch, where the devices' System update app
# looks (build.sh publish, S30_APK_REPO). The signing key is the secret
# S30_SIGN_KEY (the contents of build/s30.rsa): without it build.sh stops,
# since the public key in the tree only matches that key.
#
# The slow parts (kernel, U-Boot, Mesa, RetroArch, EmulationStation) are
# skipped when their outputs are in the Actions cache under a key made of
# everything they are built from: the submodule commit, the patches and
# board files, their build.sh step. A full build is about an hour; with the
# caches a run is the rootfs and the packaging, a few minutes.
name: packages
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: packages
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the package versions are the commit count
      - name: Signing key
        run: |
          [ -n "$S30_SIGN_KEY" ] || { echo "secret S30_SIGN_KEY is not set" >&2; exit 1; }
          umask 077; printf '%s\n' "$S30_SIGN_KEY" > build/s30.rsa
        env:
          S30_SIGN_KEY: ${{ secrets.S30_SIGN_KEY }}
      - name: Submodules build.sh does not fetch itself
        run: git submodule update --init --depth 1 external/es-theme-carbon
      - name: Cache keys (what each step is built from)
        id: keys
        run: |
          key() { # NAME SUBMODULE PATHS...: sha256 of the submodule commit, the files' blob ids, the step's text (and NAME_VERSION=)
            local name="$1" sub="$2"; shift 2
            { [ -z "$sub" ] || git rev-parse "HEAD:external/$sub"
              git ls-files -s "$@"
              sed -n "/^step_$name() {/,/^}/p" build/build.sh
              grep "^${name^^}_VERSION=" build/build.sh || true
            } | sha256sum | cut -c1-16 | sed "s/^/$name=${{ runner.os }}-$name-/" >> "$GITHUB_OUTPUT"
          }
          key linux linux patches/linux linux build/kernel.config
          key uboot u-boot patches/u-boot build/u-boot build/boot.cmd
          key mesa "" patches/mesa
          key retroarch retroarch patches/retroarch
          key emulationstation emulationstation patches/emulationstation
          cat "$GITHUB_OUTPUT"
      - run: bash build/build.sh deps

      - uses: actions/cache@v4
        id: cache-linux
        with:
          key: ${{ steps.keys.outputs.linux }}
          path: |
            s30-build/boot/zImage
            s30-build/boot/sun8i-a33-pocketgo-s30.dtb
            s30-build/boot/linux.version
      - if: steps.cache-linux.outputs.cache-hit != 'true'
        run: bash build/build.sh linux

      - uses: actions/cache@v4
        id: cache-uboot
        with:
          key: ${{ steps.keys.outputs.uboot }}
          path: |
            s30-build/u-boot-sunxi-with-spl.bin
            s30-build/u-boot.version
            s30-build/bin/mkimage
            s30-build/boot/boot.scr
      - if: steps.cache-uboot.outputs.cache-hit != 'true'
        run: bash build/build.sh uboot

      - run: bash build/build.sh rootfs

      - uses: actions/cache@v4
        id: cache-mesa
        with:
          key: ${{ steps.keys.outputs.mesa }}
          path: s30-build/mesa-root
      - if: steps.cache-mesa.outputs.cache-hit != 'true'
        run: bash build/build.sh mesa

      - run: bash build/build.sh launcher

      - uses: actions/cache@v4
        id: cache-retroarch
        with:
          key: ${{ steps.keys.outputs.retroarch }}
          path: s30-build/retroarch.bin
      - if: steps.cache-retroarch.outputs.cache-hit != 'true'
        run: bash build/build.sh retroarch

      - uses: actions/cache@v4
        id: cache-emulationstation
        with:
          key: ${{ steps.keys.outputs.emulationstation }}
          path: s30-build/emulationstation-root
      - if: steps.cache-emulationstation.outputs.cache-hit != 'true'
        run: bash build/build.sh emulationstation

      - run: bash build/build.sh initramfs
      - run: bash build/build.sh publish
      - name: Flash image and loader (for a card or s30-flash by hand)
        run: bash build/build.sh flash
      - uses: actions/upload-artifact@v4
        with:
          name: boot
          path: |
            out/spi-nor.bin
            s30-build/u-boot-sunxi-with-spl.bin
            s30-build/boot/
            s30-build/uInitrd
            s30-build/fel.scr
            s30-build/rootfs.sqfs
          if-no-files-found: error
